<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - W.A.R.N Security Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 400px; width: 100%; padding: 20px; }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 48px; font-family: 'Billabong', cursive; color: #262626; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
            margin-bottom: 15px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login:disabled { background: #b2b2b2; cursor: not-allowed; }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .alert-warning { background: #fff3cd; color: #856404; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .alert-critical { background: #dc3545; color: white; font-weight: 600; }
        .attempts-counter { text-align: center; margin-top: 15px; font-size: 13px; }
        .locked-message { text-align: center; padding: 30px; }
        .locked-message h2 { color: #dc3545; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>Instagram</h1>
            </div>
            
            <div id="alert-container"></div>
            
            <div id="login-form">
                <input type="text" id="username" placeholder="Phone number, username, or email">
                <input type="password" id="password" placeholder="Password">
                <button class="btn-login" id="login-btn">Log In</button>
                <div class="attempts-counter" id="attempts-counter">3 attempts remaining</div>
            </div>
            
            <div id="locked-screen" style="display: none;">
                <div class="locked-message">
                    <h2>🔒 Account Locked</h2>
                    <p><strong>W.A.R.N Security Action:</strong></p>
                    <p id="action-description">Browser terminated and IP blocked for security.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let attempts = 0;
        const MAX_ATTEMPTS = 3;
        
        const loginBtn = document.getElementById('login-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const attemptsCounter = document.getElementById('attempts-counter');
        const alertContainer = document.getElementById('alert-container');
        const loginForm = document.getElementById('login-form');
        const lockedScreen = document.getElementById('locked-screen');
        
        function showAlert(message, type) {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
        
        function updateAttemptsCounter() {
            const remaining = MAX_ATTEMPTS - attempts;
            attemptsCounter.textContent = `${remaining} attempt${remaining !== 1 ? 's' : ''} remaining`;
        }
        
        async function handleLogin() {
            const username = usernameInput.value;
            const password = passwordInput.value;
            
            if (!username || !password) {
                showAlert('Please enter username and password', 'warning');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                const response = await fetch('http://localhost:5000/demo/instagram-login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    mode: 'cors',
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        ip: '192.168.1.100'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && !data.blocked) {
                    showAlert('Login successful!', 'success');
                } else {
                    attempts = data.current_attempts || attempts + 1;
                    updateAttemptsCounter();
                    
                    if (data.blocked || attempts >= MAX_ATTEMPTS) {
                        showAlert('CRITICAL: Browser will be terminated!', 'critical');
                        
                        setTimeout(() => {
                            loginForm.style.display = 'none';
                            lockedScreen.style.display = 'block';
                            
                            // Simulate browser termination
                            setTimeout(() => {
                                if (confirm('W.A.R.N Security: Browser termination initiated. Close window?')) {
                                    window.close();
                                }
                            }, 2000);
                        }, 1000);
                    } else {
                        showAlert(data.message || 'Invalid credentials', 'warning');
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                attempts++;
                updateAttemptsCounter();
                
                // Simulate security response even on connection error
                if (attempts >= MAX_ATTEMPTS) {
                    showAlert('CRITICAL: Maximum attempts reached! Browser termination initiated.', 'critical');
                    setTimeout(() => {
                        loginForm.style.display = 'none';
                        lockedScreen.style.display = 'block';
                        
                        setTimeout(() => {
                            if (confirm('W.A.R.N Security: Browser termination initiated. Close window?')) {
                                window.close();
                            }
                        }, 2000);
                    }, 1000);
                } else {
                    showAlert(`Connection error - Failed attempt ${attempts}/3`, 'danger');
                }
            }
            
            loginBtn.disabled = false;
            loginBtn.textContent = 'Log In';
        }
        
        loginBtn.addEventListener('click', handleLogin);
        
        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
